{% include 'base.html' %}
{% load static %}

<body>
<main id="main" class="main">
  <div class="pagetitle bg-white p-2">
    <h1>Add Trips - {{ party.name }}</h1>
    <nav class="mt-2">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% url 'dashboard' %}">Dashboard</a></li>
        <li class="breadcrumb-item active">Add Trips</li>
      </ol>
    </nav>
  </div>

  <section class="section">
    <div class="row">
      <div class="col-lg-12">
        <div class="card bg-light shadow-sm">
          <div class="card-body py-4">

            <form method="POST">
              {% csrf_token %}
              
              <div class="table-responsive">
                <table class="table table-bordered table-striped align-middle" id="trips_table">
                  <thead class="table-dark">
                    <tr>
                      <th>Date</th>
                      <th>Tanker No</th>
                      <th>Driver</th>
                      <th>Load (MT)</th>
                      <th>Status</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    <!-- Initial 1 row -->
                    <tr>
                      <td><input type="date" name="date" value="{{ today }}" class="form-control" required></td>
                      <td><input type="text" name="tanker_no" class="form-control" placeholder="tanker no" required></td>
                      <td><input type="text" name="driver" class="form-control" placeholder="driver name" required></td>
                      <td><input type="number" step="0.01" name="load_mt" class="form-control" placeholder="load mt" required></td>
                      <td>
                        <select name="status" class="form-select">
                          <option value="pending">Pending</option>
                          <option value="confirm">Confirm</option>
                        </select>
                      </td>
                      <td>
                        <button type="button" class="btn btn-danger btn-sm" onclick="removeRow(this)">Remove</button>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <div class="mt-3 d-flex gap-2 float-end">
                <button type="button" class="btn btn-danger btn-sm" onclick="addRow()">Add Row</button>
                <button type="submit" class="btn btn-success btn-sm">Save Trips</button>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
function addRow() {
    let table = document.getElementById('trips_table').getElementsByTagName('tbody')[0];
    let row = table.insertRow(-1); // insert at the end
    row.innerHTML = `
        <td><input type="date" name="date" value="{{ today }}" class="form-control" required></td>
        <td><input type="text" name="tanker_no" class="form-control" required></td>
        <td><input type="text" name="driver" class="form-control" required></td>
        <td><input type="number" step="0.01" name="load_mt" class="form-control" required></td>
        <td>
            <select name="status" class="form-select">
                <option value="pending">Pending</option>
                <option value="confirm">Confirm</option>
            </select>
        </td>
        <td><button type="button" class="btn btn-danger btn-sm" onclick="removeRow(this)">Remove</button></td>
    `;
}

function removeRow(button) {
    let row = button.parentNode.parentNode;
    row.parentNode.removeChild(row);
}
</script>

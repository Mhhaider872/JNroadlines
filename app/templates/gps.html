<!DOCTYPE html>
<html>
<head>
    <title>Vehicle Live Location</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Leaflet JS (Map ke liye) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body class="container mt-4">
    <h2>🚚 Vehicle Live Location</h2>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% else %}
        <table class="table table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Vehicle Name</th>
                    <th>Latitude</th>
                    <th>Longitude</th>
                    <th>Last Updated</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>{{ data.root.vehicle_Name }}</td>
                    <td>{{ data.root.latitude }}</td>
                    <td>{{ data.root.longitude }}</td>
                    <td>{{ data.root.time }}</td>
                </tr>
            </tbody>
        </table>

        <!-- Map -->
        <div id="map" style="height: 400px;"></div>
        <script>
            var lat = {{ data.root.latitude }};
            var lon = {{ data.root.longitude }};

            var map = L.map('map').setView([lat, lon], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
            }).addTo(map);

            L.marker([lat, lon]).addTo(map)
                .bindPopup("{{ data.root.vehicle_Name }}")
                .openPopup();
        </script>
    {% endif %}
</body>
</html>

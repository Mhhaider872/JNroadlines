<!DOCTYPE html>
<html>
<head>
  <title>Track Driver</title>
  <style>
    #map {
      height: 400px;
      width: 100%;
    }
  </style>

  <!-- Replace YOUR_API_KEY below with your actual Google Maps API key -->
  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap">
  </script>
</head>
<body>

<h2>Tracking Driver: {{ driver.name }} | Tanker No: {{ driver.tanker_number }}</h2>

{% if latest_log %}
  <div id="map"></div>
  <script>
    function initMap() {
      const location = { lat: {{ latest_log.latitude }}, lng: {{ latest_log.longitude }} };

      const map = new google.maps.Map(document.getElementById("map"), {
        zoom: 15,
        center: location
      });

      const marker = new google.maps.Marker({
        position: location,
        map: map,
        title: "Driver Location"
      });
    }
  </script>
{% else %}
  <p>No location data available for this driver yet.</p>
{% endif %}

</body>
</html>

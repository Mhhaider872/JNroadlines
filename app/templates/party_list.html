{% include 'base.html' %}
{% load static %}

<body>
<main id="main" class="main">

  <!-- Page Title -->
  <div class="pagetitle bg-white p-3 shadow-sm rounded mb-4">
    <h1>Parties</h1>
    <nav>
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item"><a href="{% url 'dashboard' %}">Dashboard</a></li>
      </ol>
    </nav>
  </div>

  <!-- Parties Section -->
  <section class="section">
    <div class="row">
      <div class="col-lg-12">
        <div class="card bg-light shadow-sm rounded">
          <div class="card-body">

            <div class="container">
              <div class="row g-4">
                {% for p in parties %}
                <div class="col-sm-6 col-md-4 col-lg-3">
                  <div class="card h-100 shadow border-0 rounded-4 hover-shadow transition">
                    <div class="card-body">
                      <h5 class="card-title fw-bold">{{ p.name }}</h5>
                      <p class="card-text mb-2"><strong>Total Trips:</strong> {{ p.total_trips }}</p>
                      <p class="card-text"><strong>Total Load:</strong> {{ p.total_load }} MT</p>
                    </div>
                    <div class="card-footer d-flex justify-content-between bg-white border-0">
                      <a href="{% url 'trip_list' p.id %}" class="btn btn-primary btn-sm w-45">View Trips</a>
                      <a href="{% url 'add_multiple_trips' p.id %}" class="btn btn-success btn-sm w-45">Add Trip</a>
                    </div>
                  </div>
                </div>
                {% endfor %}
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </section>

</main>

<!-- Footer -->
<footer class="footer mt-4">
  <div class="copyright">
    &copy; Copyright <strong>J N Roadlines LLP</strong> All Rights Reserved
  </div>
  <div class="credits">
    Designed by <a href="#"><strong> JTECH VENTURES</strong></a>
  </div>
</footer>

<a href="#" class="back-to-top d-flex align-items-center justify-content-center">
  <i class="bi bi-arrow-up-short"></i>
</a>

<!-- Custom Styles -->
<style>
.hover-shadow:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 20px rgba(0,0,0,0.15);
  transition: 0.3s;
}
.w-45 {
  width: 48%;
}
</style>
</body>
